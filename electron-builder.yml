appId: com.whypred.sift
productName: Sift
# 1024×1024 PNG (build/icon.png); electron-builder derives .icns/.ico per
# platform from it at package time.
icon: build/icon.png
directories:
  output: dist-desktop
# No native modules ship inside app.asar (dist-electron/main.cjs is a pure
# esbuild bundle; better-sqlite3 only lives in the extraResources server
# tree, which already has a working N-API prebuild — see task-d2-brief.md).
# Nothing here needs an Electron-ABI rebuild.
npmRebuild: false
files:
  - dist-electron/**
  - electron/onboarding.html
  - package.json
  # dist-electron/*.cjs is a fully bundled esbuild output (only "electron"
  # is external) — no node_modules belong in app.asar. The Next server's
  # own node_modules ship separately via extraResources below.
  - "!node_modules/**"
extraResources:
  - from: .next/standalone
    to: server
  # electron-builder unconditionally strips a top-level "node_modules" dir
  # from any copy source (app-builder-lib/util/filter.js) — the standalone
  # server's own node_modules (better-sqlite3, next, react, ...) would
  # silently vanish without this second, explicitly-rooted entry.
  - from: .next/standalone/node_modules
    to: server/node_modules
mac:
  target:
    - dmg
    - zip
  identity: null
  category: public.app-category.productivity
win:
  target:
    - nsis
nsis:
  # true one-click installer: no wizard, installs and launches
  oneClick: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
  category: Office
